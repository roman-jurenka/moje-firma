<!doctype html>
<html lang="cs" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />

         přepisuje DOM stejně jako překladatelská rozšíření (DeepL apod.) a
         to kolidovalo s Reactem (chyba "removeChild... není potomkem tohoto
         uzlu"). notranslate + lang="cs" překladu úplně zabrání. -->
    <meta name="google" content="notranslate" />
    <!-- Pevná verze ikon — "latest" by mohla appku rozbít novou verzí bez varování. -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
